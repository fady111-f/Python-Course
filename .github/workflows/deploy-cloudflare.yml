name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare Credentials
        id: check_env
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ Cloudflare secrets (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) not set. Skipping Cloudflare Pages deployment."
          fi

      - name: Set up Python
        if: steps.check_env.outputs.has_secrets == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & Build Site
        if: steps.check_env.outputs.has_secrets == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material
          mkdir -p docs/dashboard
          cp dashboard/index.html docs/dashboard/index.html
          cp dashboard/index.css docs/dashboard/index.css
          mkdocs build

      - name: Publish to Cloudflare Pages
        if: steps.check_env.outputs.has_secrets == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: python-course
          directory: site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
